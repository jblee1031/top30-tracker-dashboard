<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOP30 트렌드 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #666;
    --border: #e5e5e5; --accent: #dc2626; --header-bg: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --card: #1f2023; --text: #eaeaea; --muted: #9a9a9a; --border: #34353a; --accent: #f87171; --header-bg: #26272b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 32px 0 12px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; overflow-x: auto;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px; font-size: 0.78rem; color: var(--muted); }
  .legend span.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  table { border-collapse: collapse; font-size: 0.82rem; }
  th, td { padding: 5px 9px; border: 1px solid var(--border); text-align: center; white-space: nowrap; vertical-align: top; }
  thead th.date-head { background: var(--header-bg); font-size: 0.85rem; position: sticky; top: 0; }
  thead th.field-head { background: var(--header-bg); color: var(--muted); font-weight: 500; font-size: 0.72rem; position: sticky; top: 28px; }
  td.rank-cell, th.rank-head { position: sticky; left: 0; background: var(--card); z-index: 2; font-weight: 600; }
  thead th.rank-head { z-index: 3; background: var(--header-bg); }
  td.name-cell { font-weight: 600; text-align: left; }
  td.pct-cell { color: var(--accent); font-weight: 600; }
  td.reason-cell {
    text-align: left; white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
    max-width: 280px; min-width: 200px; font-size: 0.76rem; color: var(--text); line-height: 1.45;
  }
  .reason-text {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  td.reason-cell.expanded .reason-text { -webkit-line-clamp: unset; overflow: visible; }
  .toggle-reason {
    display: inline-block; margin-top: 2px; font-size: 0.7rem; color: var(--accent);
    cursor: pointer; user-select: none;
  }
  .reason-toggle-head { cursor: pointer; user-select: none; }
  .reason-toggle-head:hover { color: var(--text); }
  .reason-toggle-icon { color: var(--accent); }
  td.reason-collapsed { text-align: center; color: var(--muted); min-width: 0; max-width: none; }
  td.sector-bg { background: hsl(var(--hue) 65% 88%); }
  @media (prefers-color-scheme: dark) {
    td.sector-bg { background: hsl(var(--hue) 40% 24%); }
  }
  .streak { display: inline-block; margin-left: 4px; font-size: 0.7rem; padding: 0 5px; border-radius: 8px; background: var(--accent); color: #fff; white-space: nowrap; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .pareto-card h3 { font-size: 0.9rem; margin: 0 0 8px; }
  .pareto-card canvas { max-height: 220px; }
  .pareto-detail { margin-top: 8px; font-size: 0.78rem; border-top: 1px dashed var(--border); padding-top: 8px; min-height: 1.2em; }
  .pareto-detail .hint { color: var(--muted); }
  .pareto-detail ul { margin: 4px 0 0; padding-left: 18px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 0.85rem;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; font-size: 0.8rem; }
  .filters label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); }
  .filters select {
    padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 0.82rem;
  }
  .filters button {
    align-self: flex-end; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 0.8rem;
  }
  .checkbox-label { flex-direction: row !important; align-items: center; gap: 5px !important; color: var(--text); cursor: pointer; }
  .checkbox-label input { cursor: pointer; }
</style>
</head>
<body>
  <h1>몽당연필 TOP30 트렌드 대시보드</h1>
  <div class="sub" id="meta">불러오는 중…</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="trend">전체 트렌드</button>
    <button class="tab-btn" data-tab="daily">일자별 조회</button>
  </div>

  <div id="tab-trend" class="tab-panel active">
    <div class="card">
      <div class="filters">
        <label>보기 단위
          <select id="periodMode">
            <option value="all">전체 기간</option>
            <option value="month">월별</option>
            <option value="week">주별</option>
          </select>
        </label>
        <label id="periodMonthWrap" style="display:none;">월
          <select id="periodMonth"></select>
        </label>
        <label id="periodWeekWrap" style="display:none;">주
          <select id="periodWeek"></select>
        </label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="filters" id="colToggles">
        <span style="color:var(--muted);">표시할 열:</span>
        <label class="checkbox-label"><input type="checkbox" id="colPct" checked> 상승률</label>
        <label class="checkbox-label"><input type="checkbox" id="colCap" checked> 시가총액</label>
        <label class="checkbox-label"><input type="checkbox" id="colSector" checked> 섹터</label>
        <label class="checkbox-label"><input type="checkbox" id="colReason" checked> 상승이유</label>
        <button type="button" id="exportExcelBtn" style="margin-left:auto;">엑셀로 다운로드</button>
      </div>
      <div id="tableWrap"></div>
    </div>

    <h2>일자별 섹터 Pareto (막대 클릭 시 해당 종목 표시)</h2>
    <div class="grid" id="paretoGrid"></div>

    <h2>섹터 히트맵 (일자 × 섹터, 종목 수 — 칸 클릭 시 해당 종목 표시)</h2>
    <div class="card">
      <div id="heatmapWrap"></div>
      <div class="pareto-detail" id="heatmapDetail"><span class="hint">칸을 클릭하면 해당 일자·섹터의 종목과 상승이유가 표시됩니다.</span></div>
    </div>

    <div class="grid" style="margin-top:16px;">
      <div class="card">
        <h3>연속 등장(모멘텀) 랭킹</h3>
        <canvas id="momentumChart"></canvas>
      </div>
      <div class="card">
        <h3>상승 테마 반복 빈도 (전체 기간)</h3>
        <canvas id="themeFreqChart"></canvas>
      </div>
      <div class="card">
        <h3>시가총액 구간 비중 변화</h3>
        <canvas id="capTrendChart"></canvas>
      </div>
    </div>
  </div>

  <div id="tab-daily" class="tab-panel">
    <div class="card">
      <div class="filters">
        <label>월
          <select id="monthSelect"></select>
        </label>
        <label>날짜
          <select id="daySelect"></select>
        </label>
        <button type="button" id="exportDailyExcelBtn" style="margin-left:auto;">엑셀로 다운로드</button>
      </div>
      <div id="dailyTableWrap"></div>
    </div>
  </div>

<script>
const PALETTE = ['#2563eb','#e0752f','#16a34a','#dc2626','#7c3aed','#0891b2','#ca8a04','#db2777','#4b5563','#059669'];

function hashHue(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}

async function main() {
  let data;
  try {
    const res = await fetch('data/latest.json', {cache: 'no-store'});
    if (!res.ok) throw new Error('no data yet');
    data = await res.json();
  } catch (e) {
    document.querySelector('.card').innerHTML = '<div class="empty">아직 데이터가 없습니다. Private 저장소에 첫 게시글 Issue를 등록하면 여기에 표시됩니다.</div>';
    document.getElementById('meta').textContent = '데이터 없음';
    return;
  }

  window.__data = data;
  window.__streaks = computeStreakByDateName(data.dates, data.boards); // full-history, used by the daily tab
  document.getElementById('meta').textContent =
    `최신 데이터: ${data.latest_date ?? '-'} · 누적 게시글 수: ${data.total_posts_ingested}`;

  setupTabs();
  setupPeriodControls(data);
  setupExcelExport();
  setupDailyTab(data);
}

// ---------- streak helpers ----------
function computeStreakByDateName(dates, boards) {
  const streakByDateName = {};
  const prevNames = new Map();
  dates.forEach(d => {
    const board = boards[d] || [];
    const seenToday = new Map();
    board.forEach(e => {
      const streak = (prevNames.get(e.name) || 0) + 1;
      seenToday.set(e.name, streak);
      streakByDateName[`${d}|${e.name}`] = streak;
    });
    prevNames.clear();
    seenToday.forEach((v, k) => prevNames.set(k, v));
  });
  return streakByDateName;
}

function computeStreakStats(dates, boards) {
  let running = {};
  const max = {};
  dates.forEach(d => {
    const today = new Set((boards[d] || []).map(e => e.name));
    const newRunning = {};
    today.forEach(name => {
      newRunning[name] = (running[name] || 0) + 1;
      max[name] = Math.max(max[name] || 0, newRunning[name]);
    });
    running = newRunning;
  });
  return { current: running, max };
}

// ---------- period (전체/월별/주별) ----------
const EOK = 100_000_000;
function capBucket(won) {
  if (!won) return null;
  if (won < 1000 * EOK) return '1천억 미만';
  if (won < 5000 * EOK) return '1천억~5천억';
  if (won < 10000 * EOK) return '5천억~1조';
  return '1조 이상';
}

function mondayOf(dateStr) {
  const y = +dateStr.slice(0, 4), m = +dateStr.slice(4, 6) - 1, d = +dateStr.slice(6, 8);
  const dt = new Date(y, m, d);
  const day = dt.getDay();
  dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day));
  return dt;
}
function weekKeyOf(dateStr) {
  const mon = mondayOf(dateStr);
  return `${mon.getFullYear()}${String(mon.getMonth() + 1).padStart(2, '0')}${String(mon.getDate()).padStart(2, '0')}`;
}
function weekLabelOf(weekKey) {
  const y = +weekKey.slice(0, 4), m = +weekKey.slice(4, 6) - 1, d = +weekKey.slice(6, 8);
  const mon = new Date(y, m, d);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = dt => `${dt.getMonth() + 1}/${dt.getDate()}`;
  return `${fmt(mon)} ~ ${fmt(sun)}`;
}

function buildPeriodView(data, dates) {
  const boards = {};
  const sector_trend = {}, theme_trend = {}, cap_bucket_trend = {};
  dates.forEach(d => {
    boards[d] = data.boards[d] || [];
    sector_trend[d] = data.sector_trend[d] || {};
    theme_trend[d] = data.theme_trend[d] || {};
    cap_bucket_trend[d] = data.cap_bucket_trend[d] || {};
  });

  const themeTotals = {};
  const latestSector = {}, latestTheme = {}, latestCap = {};
  dates.forEach(d => {
    (boards[d] || []).forEach(e => {
      if (e.theme_tag) themeTotals[e.theme_tag] = (themeTotals[e.theme_tag] || 0) + 1;
      latestSector[e.name] = e.sector_tag;
      if (e.theme_tag) latestTheme[e.name] = e.theme_tag;
      if (e.market_cap != null) latestCap[e.name] = e.market_cap;
    });
  });

  const theme_frequency = Object.entries(themeTotals)
    .map(([theme, count]) => ({ theme, count }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 30);

  const streaks = computeStreakStats(dates, boards);
  const names = new Set();
  dates.forEach(d => (boards[d] || []).forEach(e => names.add(e.name)));
  const momentum_ranking = [...names]
    .map(name => ({
      name,
      current_streak: streaks.current[name] || 0,
      max_streak: streaks.max[name] || 0,
      sector: latestSector[name] || '미상',
      theme: latestTheme[name] || '',
      market_cap: latestCap[name] ?? null,
    }))
    .filter(m => m.max_streak > 1)
    .sort((a, b) => (b.current_streak - a.current_streak) || (b.max_streak - a.max_streak))
    .slice(0, 30);

  return {
    dates, boards, sector_trend, theme_trend, cap_bucket_trend,
    cap_bucket_labels: data.cap_bucket_labels,
    theme_frequency, momentum_ranking,
    latest_date: dates[dates.length - 1] || null,
    total_posts_ingested: dates.length,
  };
}

function setupPeriodControls(data) {
  const modeSel = document.getElementById('periodMode');
  const monthSel = document.getElementById('periodMonth');
  const weekSel = document.getElementById('periodWeek');
  const monthWrap = document.getElementById('periodMonthWrap');
  const weekWrap = document.getElementById('periodWeekWrap');

  const months = [...new Set(data.dates.map(d => d.slice(0, 6)))].sort();
  months.forEach(m => monthSel.insertAdjacentHTML('beforeend',
    `<option value="${m}">${m.slice(0, 4)}년 ${+m.slice(4, 6)}월</option>`));

  const weekKeys = [...new Set(data.dates.map(weekKeyOf))].sort();
  weekKeys.forEach(w => weekSel.insertAdjacentHTML('beforeend',
    `<option value="${w}">${weekLabelOf(w)}</option>`));

  if (months.length) monthSel.value = months[months.length - 1];
  if (weekKeys.length) weekSel.value = weekKeys[weekKeys.length - 1];

  function currentDates() {
    if (modeSel.value === 'month') return data.dates.filter(d => d.slice(0, 6) === monthSel.value);
    if (modeSel.value === 'week') return data.dates.filter(d => weekKeyOf(d) === weekSel.value);
    return data.dates;
  }

  function refresh() {
    monthWrap.style.display = modeSel.value === 'month' ? '' : 'none';
    weekWrap.style.display = modeSel.value === 'week' ? '' : 'none';
    renderTrendTab(buildPeriodView(data, currentDates()));
  }

  modeSel.addEventListener('change', refresh);
  monthSel.addEventListener('change', refresh);
  weekSel.addEventListener('change', refresh);

  refresh();
}

function renderTrendTab(viewData) {
  window.__currentView = viewData; // used by the Excel export button
  renderLegend(viewData);
  setupColumnToggles(viewData);
  renderTable(viewData);
  renderParetoGrid(viewData);
  renderHeatmap(viewData);
  renderMomentum(viewData);
  renderThemeFrequency(viewData);
  renderCapTrend(viewData);
}

// ---------- Excel export ----------
function setupExcelExport() {
  document.getElementById('exportExcelBtn').onclick = () => {
    const view = window.__currentView;
    if (!view || !view.dates.length) return;

    const rows = [];
    view.dates.forEach(d => {
      (view.boards[d] || []).slice().sort((a, b) => a.rank - b.rank).forEach(e => {
        rows.push({
          '날짜': formatDate(d),
          '순위': e.rank,
          '종목': e.name,
          '상승률(%)': e.change_pct,
          '시가총액': e.market_cap_display,
          '섹터': e.sector_tag,
          '상승테마': e.theme_tag || '',
          '상승이유': e.reason || '',
        });
      });
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 11 }, { wch: 5 }, { wch: 16 }, { wch: 9 }, { wch: 9 }, { wch: 16 }, { wch: 16 }, { wch: 60 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'TOP30');

    const range = view.dates.length > 1 ? `${formatDate(view.dates[0])}_${formatDate(view.dates[view.dates.length - 1])}` : formatDate(view.dates[0]);
    XLSX.writeFile(wb, `TOP30_${range}.xlsx`);
  };
}

// ---------- tabs ----------
function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });
}

// ---------- legend ----------
function renderLegend(data) {
  const sectors = new Set();
  Object.values(data.boards || {}).forEach(board => board.forEach(e => sectors.add(e.sector_tag)));
  const legend = document.getElementById('legend');
  legend.innerHTML = [...sectors].sort().map(s =>
    `<span><span class="swatch" style="background:hsl(${hashHue(s)} 70% 55%)"></span>${s}</span>`
  ).join('') + '<span><span class="streak" style="position:static;">N일</span> = 전날에도 TOP30에 있던 종목(연속 등장)</span>';
}

// ---------- main comparison table ----------
// Columns after 종목(name) are optional — user toggles which ones are wide
// enough to bother showing, since the table repeats these per date and
// gets very wide horizontally.
const COLUMN_DEFS = [
  { key: 'pct', label: '상승률', checkboxId: 'colPct' },
  { key: 'cap', label: '시가총액', checkboxId: 'colCap' },
  { key: 'sector', label: '섹터', checkboxId: 'colSector' },
  { key: 'reason', label: '상승이유', checkboxId: 'colReason' },
];

function activeColumns() {
  return COLUMN_DEFS.filter(c => document.getElementById(c.checkboxId)?.checked ?? true);
}

// Per-date collapse for the 상승이유 column specifically — the master
// checkbox above shows/hides it everywhere; this lets a user additionally
// hide it for just one or two dates (click the header) to save width
// without losing the column for every date.
const collapsedReasonDates = new Set();

function cellForColumn(col, entry, hueStyle, date) {
  switch (col.key) {
    case 'pct':
      return `<td class="pct-cell sector-bg" style="${hueStyle}">${entry.change_pct != null && entry.change_pct !== '' ? entry.change_pct + '%' : '-'}</td>`;
    case 'cap':
      return `<td class="sector-bg" style="${hueStyle}">${entry.market_cap_display || '-'}</td>`;
    case 'sector':
      return `<td class="sector-bg" style="${hueStyle}">${entry.sector_tag}</td>`;
    case 'reason':
      if (collapsedReasonDates.has(date)) {
        return `<td class="reason-cell reason-collapsed sector-bg" style="${hueStyle}">···</td>`;
      }
      return `<td class="reason-cell sector-bg" style="${hueStyle}">${reasonCellInner(entry.reason)}</td>`;
  }
}

function columnHeaderCell(col, date) {
  if (col.key !== 'reason') return `<th class="field-head">${col.label}</th>`;
  const collapsed = collapsedReasonDates.has(date);
  return `<th class="field-head reason-toggle-head" data-date="${date}" title="클릭하면 이 날짜의 상승이유만 접거나 폅니다">
    ${col.label} <span class="reason-toggle-icon">${collapsed ? '▸' : '▾'}</span>
  </th>`;
}

function reasonCellInner(reason) {
  if (!reason) return '-';
  return `<span class="reason-text">${reason}</span><span class="toggle-reason">더보기</span>`;
}

// Delegated click handler for the "더보기/접기" toggle — attached once,
// works for cells re-rendered later (main table, daily table).
document.addEventListener('click', (evt) => {
  const toggle = evt.target.closest('.toggle-reason');
  if (!toggle) return;
  const cell = toggle.closest('td.reason-cell');
  cell.classList.toggle('expanded');
  toggle.textContent = cell.classList.contains('expanded') ? '접기' : '더보기';
});

function renderTable(data) {
  const dates = data.dates;
  if (!dates.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }

  const streakByDateName = computeStreakByDateName(dates, data.boards);
  const maxRank = Math.max(30, ...dates.map(d => (data.boards[d] || []).length));
  const columns = activeColumns();
  const colCount = 1 + columns.length; // 종목 + toggled columns

  let html = '<table class="rank-table"><thead>';
  html += '<tr><th class="rank-head" rowspan="2">순위</th>' +
    dates.map(d => `<th class="date-head" colspan="${colCount}">${formatDate(d)}</th>`).join('') + '</tr>';
  html += '<tr>' + dates.map(d =>
    '<th class="field-head">종목</th>' + columns.map(c => columnHeaderCell(c, d)).join('')
  ).join('') + '</tr>';
  html += '</thead><tbody>';

  for (let rank = 1; rank <= maxRank; rank++) {
    html += `<tr><td class="rank-cell">${rank}</td>`;
    for (const d of dates) {
      const entry = (data.boards[d] || []).find(e => e.rank === rank);
      if (!entry) { html += '<td></td>'.repeat(colCount); continue; }
      const hue = hashHue(entry.sector_tag);
      const hueStyle = `--hue:${hue};`;
      const streak = streakByDateName[`${d}|${entry.name}`] || 1;
      const streakBadge = streak > 1 ? `<span class="streak" title="${streak}일 연속 TOP30 등장">${streak}일</span>` : '';
      html += `<td class="name-cell sector-bg" style="${hueStyle}">${entry.name}${streakBadge}</td>`;
      html += columns.map(c => cellForColumn(c, entry, hueStyle, d)).join('');
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = html;
  wrap.onclick = (evt) => {
    const head = evt.target.closest('.reason-toggle-head');
    if (!head) return;
    const d = head.dataset.date;
    collapsedReasonDates.has(d) ? collapsedReasonDates.delete(d) : collapsedReasonDates.add(d);
    renderTable(data);
  };
}

// ---------- column visibility toggles ----------
function setupColumnToggles(data) {
  COLUMN_DEFS.forEach(c => {
    document.getElementById(c.checkboxId).onchange = () => renderTable(data);
  });
}

// ---------- 일자별 조회 tab ----------
function setupDailyTab(data) {
  const monthSel = document.getElementById('monthSelect');
  const daySel = document.getElementById('daySelect');
  const months = [...new Set(data.dates.map(d => d.slice(0, 6)))].sort();

  months.forEach(m => monthSel.insertAdjacentHTML('beforeend',
    `<option value="${m}">${m.slice(0,4)}년 ${+m.slice(4,6)}월</option>`));

  function populateDays() {
    daySel.innerHTML = '';
    const daysInMonth = data.dates.filter(d => d.slice(0, 6) === monthSel.value);
    daysInMonth.forEach(d =>
      daySel.insertAdjacentHTML('beforeend', `<option value="${d}">${formatDate(d)}</option>`));
    if (daysInMonth.length) daySel.value = daysInMonth[daysInMonth.length - 1]; // default: latest day in month
    renderDailyTable(data, daySel.value);
  }

  monthSel.addEventListener('change', populateDays);
  daySel.addEventListener('change', () => renderDailyTable(data, daySel.value));

  document.getElementById('exportDailyExcelBtn').onclick = () => {
    if (!daySel.value) return;
    const board = [...(data.boards[daySel.value] || [])].sort((a, b) => a.rank - b.rank);
    const rows = board.map(e => ({
      '순위': e.rank, '종목': e.name, '상승률(%)': e.change_pct, '시가총액': e.market_cap_display,
      '섹터': e.sector_tag, '상승테마': e.theme_tag || '', '상승이유': e.reason || '',
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 5 }, { wch: 16 }, { wch: 9 }, { wch: 9 }, { wch: 16 }, { wch: 16 }, { wch: 60 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'TOP30');
    XLSX.writeFile(wb, `TOP30_${formatDate(daySel.value)}.xlsx`);
  };

  if (months.length) {
    monthSel.value = months[months.length - 1];
    populateDays();
  } else {
    document.getElementById('dailyTableWrap').innerHTML = '<div class="empty">데이터 없음</div>';
  }
}

function renderDailyTable(data, date) {
  const wrap = document.getElementById('dailyTableWrap');
  if (!date) { wrap.innerHTML = '<div class="empty">날짜를 선택하세요.</div>'; return; }
  const board = [...(data.boards[date] || [])].sort((a, b) => a.rank - b.rank);
  if (!board.length) { wrap.innerHTML = '<div class="empty">해당 날짜 데이터 없음</div>'; return; }

  let html = `<table class="rank-table"><thead><tr>
    <th>순위</th><th>종목</th><th>상승률</th><th>시가총액</th><th>섹터</th><th>상승이유</th>
  </tr></thead><tbody>`;
  board.forEach(entry => {
    const hue = hashHue(entry.sector_tag);
    const streak = window.__streaks[`${date}|${entry.name}`] || 1;
    const streakBadge = streak > 1 ? `<span class="streak" title="${streak}일 연속 TOP30 등장">${streak}일</span>` : '';
    html += `<tr>
      <td class="rank-cell">${entry.rank}</td>
      <td class="name-cell sector-bg" style="--hue:${hue};">${entry.name}${streakBadge}</td>
      <td class="pct-cell sector-bg" style="--hue:${hue};">${entry.change_pct != null && entry.change_pct !== '' ? entry.change_pct + '%' : '-'}</td>
      <td class="sector-bg" style="--hue:${hue};">${entry.market_cap_display || '-'}</td>
      <td class="sector-bg" style="--hue:${hue};">${entry.sector_tag}</td>
      <td class="reason-cell sector-bg" style="--hue:${hue};">${reasonCellInner(entry.reason)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ---------- per-date sector Pareto ----------
function renderParetoGrid(data) {
  const grid = document.getElementById('paretoGrid');
  grid.innerHTML = '';
  const dates = [...data.dates].reverse(); // most recent first

  dates.forEach(date => {
    const counts = data.sector_trend[date] || {};
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    if (!sorted.length) return;

    const total = sorted.reduce((s, [, v]) => s + v, 0);
    let running = 0;
    const cumPct = sorted.map(([, v]) => { running += v; return +(running / total * 100).toFixed(1); });

    const card = document.createElement('div');
    card.className = 'card pareto-card';
    const canvasId = `pareto-${date}`;
    card.innerHTML = `<h3>${formatDate(date)}</h3><canvas id="${canvasId}"></canvas>
      <div class="pareto-detail" id="detail-${date}"><span class="hint">막대를 클릭하면 해당 섹터 종목이 표시됩니다.</span></div>`;
    grid.appendChild(card);

    const ctx = document.getElementById(canvasId);
    new Chart(ctx, {
      data: {
        labels: sorted.map(([s]) => s),
        datasets: [
          {
            type: 'bar',
            label: '종목 수',
            data: sorted.map(([, v]) => v),
            backgroundColor: sorted.map(([s]) => `hsl(${hashHue(s)} 65% 60%)`),
            yAxisID: 'y',
          },
          {
            type: 'line',
            label: '누적 %',
            data: cumPct,
            borderColor: '#888',
            borderWidth: 1.5,
            pointRadius: 2,
            yAxisID: 'y1',
          },
        ],
      },
      options: {
        responsive: true,
        onClick: (evt, elements, chart) => {
          const pts = chart.getElementsAtEventForMode(evt, 'nearest', {intersect: true}, true);
          if (!pts.length) return;
          const sector = sorted[pts[0].index][0];
          showSectorDetail(date, sector);
        },
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 40, font: { size: 9 } } },
          y: { beginAtZero: true, ticks: { stepSize: 1 } },
          y1: { position: 'right', min: 0, max: 100, grid: { drawOnChartArea: false }, ticks: { callback: v => v + '%' } },
        },
      },
    });
  });
}

function sectorDetailHTML(date, sector) {
  const board = (window.__data.boards[date] || []).filter(e => e.sector_tag === sector).sort((a, b) => a.rank - b.rank);
  return `<strong>${formatDate(date)} · ${sector}</strong> (${board.length}개)<ul>` +
    board.map(e => `<li><strong>${e.name}</strong> · ${e.change_pct}% · ${e.market_cap_display || '-'}<br>
      <span style="color:var(--muted);">${e.reason || '-'}</span></li>`).join('') +
    '</ul>';
}

function showSectorDetail(date, sector) {
  document.getElementById(`detail-${date}`).innerHTML = sectorDetailHTML(date, sector);
}

function showHeatmapDetail(date, sector) {
  document.getElementById('heatmapDetail').innerHTML = sectorDetailHTML(date, sector);
}

// ---------- sector heatmap ----------
function renderHeatmap(data) {
  const dates = data.dates;
  const totals = {};
  dates.forEach(d => Object.entries(data.sector_trend[d] || {}).forEach(([s, v]) => { totals[s] = (totals[s] || 0) + v; }));
  const sectors = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, 20);
  const maxVal = Math.max(1, ...dates.flatMap(d => sectors.map(s => (data.sector_trend[d] || {})[s] || 0)));

  let html = '<table><thead><tr><th>섹터</th>' + dates.map(d => `<th>${formatDate(d)}</th>`).join('') + '</tr></thead><tbody>';
  sectors.forEach(s => {
    html += `<tr><td style="text-align:left;">${s}</td>`;
    dates.forEach(d => {
      const v = (data.sector_trend[d] || {})[s] || 0;
      const alpha = v ? 0.15 + 0.75 * (v / maxVal) : 0.04;
      const clickable = v ? `data-date="${d}" data-sector="${s}" style="cursor:pointer;background:hsl(${hashHue(s)} 70% 50% / ${alpha});"` : `style="background:hsl(${hashHue(s)} 70% 50% / ${alpha});"`;
      html += `<td ${clickable}>${v || ''}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  const wrap = document.getElementById('heatmapWrap');
  wrap.innerHTML = html;
  wrap.onclick = (evt) => {
    const cell = evt.target.closest('td[data-date]');
    if (cell) showHeatmapDetail(cell.dataset.date, cell.dataset.sector);
  };
}

// ---------- momentum ranking ----------
let momentumChartInstance = null;
function renderMomentum(data) {
  const top = (data.momentum_ranking || []).slice(0, 15);
  if (momentumChartInstance) momentumChartInstance.destroy();
  momentumChartInstance = new Chart(document.getElementById('momentumChart'), {
    type: 'bar',
    data: {
      labels: top.map(m => `${m.name} (${m.sector})`),
      datasets: [{ label: '현재 연속 등장일', data: top.map(m => m.current_streak), backgroundColor: '#2563eb' }],
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } },
    },
  });
}

// ---------- theme frequency ----------
let themeFreqChartInstance = null;
function renderThemeFrequency(data) {
  const top = (data.theme_frequency || []).slice(0, 15);
  if (themeFreqChartInstance) themeFreqChartInstance.destroy();
  themeFreqChartInstance = new Chart(document.getElementById('themeFreqChart'), {
    type: 'bar',
    data: {
      labels: top.map(t => t.theme),
      datasets: [{ label: '등장 횟수', data: top.map(t => t.count), backgroundColor: top.map(t => `hsl(${hashHue(t.theme)} 65% 55%)`) }],
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } },
    },
  });
}

// ---------- market cap bucket trend ----------
let capTrendChartInstance = null;
function renderCapTrend(data) {
  const dates = data.dates;
  const labels = data.cap_bucket_labels || [];
  const datasets = labels.map((label, i) => ({
    label,
    data: dates.map(d => (data.cap_bucket_trend[d] || {})[label] || 0),
    backgroundColor: PALETTE[i % PALETTE.length],
  }));
  if (capTrendChartInstance) capTrendChartInstance.destroy();
  capTrendChartInstance = new Chart(document.getElementById('capTrendChart'), {
    type: 'bar',
    data: { labels: dates.map(formatDate), datasets },
    options: {
      responsive: true,
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } } },
      plugins: { legend: { position: 'bottom' } },
    },
  });
}

function formatDate(d) {
  return d.length === 8 ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : d;
}

main().catch(console.error);
</script>
